<!DOCTYPE html>
<html>
<head><title>Upload QR Code</title></head>
<body>
    <h1>Upload QR Code</h1>
    <form action="/app/createQRCodeUpload" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <p>QR code: <input type="file" name="imageUpload" accept="image/*" required></p>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
