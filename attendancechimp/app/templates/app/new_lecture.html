<!DOCTYPE html>
<html>
<head><title>New Lecture</title></head>
<body>
    <h1>New Lecture</h1>
    <form action="/app/createLecture" method="post">
        {% csrf_token %}
        <p>Course:
            <select name="choice" required>
                {% for course in courses %}
                    <option value="{{ course.name }}">{{ course.name }}</option>
                {% endfor %}
            </select>
        </p>
        <button type="submit">Create Lecture</button>
    </form>
</body>
</html>
